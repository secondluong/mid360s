# Pi5 + L2 直连拓扑：使用 host 网络，UDP 不经 Docker NAT。
# MyView 调度机在另一台机器上，通过 MYVIEW_SERVER_URL 连接。

services:
  lidar-bridge-ros:
    build:
      context: .
      dockerfile: Dockerfile
      # Override repo URLs with a mirror, or set GIT_SSL_NO_VERIFY=1, when the
      # build host can't verify github's TLS cert (see .env.example / README).
      args:
        UNILIDAR_SDK2_REPO: ${UNILIDAR_SDK2_REPO:-https://github.com/unitreerobotics/unilidar_sdk2.git}
        POINT_LIO_REPO: ${POINT_LIO_REPO:-https://github.com/unitreerobotics/point_lio_unilidar.git}
        GIT_SSL_NO_VERIFY: ${GIT_SSL_NO_VERIFY:-0}
    image: myview/lidar-bridge-ros:latest
    container_name: myview-lidar-bridge-ros
    restart: unless-stopped
    network_mode: host
    volumes:
      # Directory mounts only — never bind-mount a single file path.
      # If the host file is missing, Docker creates a *directory* with that
      # name and silently breaks git-tracked files (entrypoint.sh / relay.py).
      - ./scripts:/opt/myview-relay/scripts:ro
      - ./relay:/opt/myview-relay/relay:ro
    env_file:
      - .env
    environment:
      ROS_DISTRO: noetic
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
