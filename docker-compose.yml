# NanoPC-T6: Mid-360 on ethernet, MyView push via WiFi (4G fallback), WiFi STA for LAN.
# host network so Livox UDP and 4G/WiFi routes are not NATed.

services:
  lidar-bridge-ros:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LIVOX_SDK2_REPO: ${LIVOX_SDK2_REPO:-https://github.com/Livox-SDK/Livox-SDK2.git}
        LIVOX_ROS_DRIVER2_REPO: ${LIVOX_ROS_DRIVER2_REPO:-https://github.com/Livox-SDK/livox_ros_driver2.git}
        POINT_LIO_REPO: ${POINT_LIO_REPO:-https://github.com/hku-mars/Point-LIO.git}
        POINT_LIO_REF: ${POINT_LIO_REF:-}
        GIT_SSL_NO_VERIFY: ${GIT_SSL_NO_VERIFY:-0}
    image: myview/lidar-bridge-ros:latest
    container_name: myview-lidar-bridge-ros
    restart: unless-stopped
    network_mode: host
    # Point-LIO used to grow until the host OOM killer ran. A 4 GB ceiling
    # kills that process inside the container while SSH on the host still
    # has memory left. The buffer cap should keep it well under this.
    mem_limit: 4g
    memswap_limit: 4g
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # Directory mounts only — never bind-mount a single file path.
      - ./scripts:/opt/myview-relay/scripts:ro
      - ./relay:/opt/myview-relay/relay:ro
      - ./local_viewer:/opt/myview-relay/local_viewer:ro
      - ./config:/opt/myview-relay/config:ro
      - ./launch:/opt/myview-relay/launch:ro
      - ./entrypoint.sh:/opt/myview-relay/entrypoint.sh:ro
      - ./data/offline-buffer:/var/lib/myview-relay/offline-buffer
      # MyView settings from the :8080 page, chosen uplink, relay status.
      - ./data/settings:/var/lib/myview-relay/settings
      - ./data/gift:/opt/myview-relay/data/gift:ro
      - ./data/fireman:/opt/myview-relay/data/fireman:ro
    env_file:
      - .env
    environment:
      ROS_DISTRO: noetic
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
